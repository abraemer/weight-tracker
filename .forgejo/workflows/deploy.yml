name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: docker
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # The job container (node:22-bookworm) already ships openssh-client and
      # curl; only the docker CLI is missing.
      - name: install docker CLI
        run: apt-get update && apt-get install -y docker.io

      - name: write ssh key material
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          printf '%s\n' "${{ secrets.KNOWN_HOSTS }}" > /tmp/known_hosts

      - name: build image
        run: DOCKER_HOST=tcp://dind:2375 docker build --platform linux/arm64 -t weight-tracker:arm64 -t weight-tracker:${{ github.ref_name }} .

      - name: deliver and deploy
        run: |
          DOCKER_HOST=tcp://dind:2375 docker save weight-tracker:arm64 | gzip | \
            ssh -o BatchMode=yes -o ConnectTimeout=15 \
                -o UserKnownHostsFile=/tmp/known_hosts -i /tmp/deploy_key \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                bash /docker/weight-tracker/scripts/ci-deploy.sh | tee /tmp/deploy-output.txt

      - name: notify success
        # Owner rule: human-friendly text — service + reason, no hashes/refs.
        # Reaching this step implies healthy: ci-deploy.sh verified the
        # container's 200 liveness before exiting 0.
        if: success()
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            MSG="weight-tracker deployed — release ${{ github.ref_name }} published, service updated and healthy"
          else
            MSG="weight-tracker deployed — manual dispatch, service updated and healthy"
          fi
          curl -sf -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -d "$MSG" \
            "${{ secrets.NTFY_URL }}/${{ secrets.NTFY_INFO_TOPIC }}"

      - name: notify failure
        if: failure()
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TRIGGER="release published"
          else
            TRIGGER="manual dispatch"
          fi
          MSG="weight-tracker deployment FAILED — trigger: ${TRIGGER}. Check forgejo Actions for adrian/weight-tracker to see the failing step."
          curl -sf -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -d "$MSG" \
            "${{ secrets.NTFY_URL }}/${{ secrets.NTFY_ALERT_TOPIC }}"
